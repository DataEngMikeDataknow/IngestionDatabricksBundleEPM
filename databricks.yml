bundle:
  name: vera_framework_bundle

artifacts:
  vera_framework_wheel:
    type: whl
    build: pip wheel --no-deps --wheel-dir dist .
    path: .

# Archivos que NO deben sincronizarse al workspace.
# __pycache__/.pyc son volátiles (se regeneran al construir el wheel) y rompen
# el deploy con "no such file or directory". El wheel de dist/ se sube por el
# mecanismo de 'artifacts', no por el sync de archivos.
sync:
  exclude:
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "dist/**"
    - ".databricks/**"


# Declaración global de variables

variables:
  catalog_destino:     { description: "Catalogo de las tablas destino y control" }
  schema_destino:      { description: "Schema (compartido con legacy)" }
  volume_path:         { description: "Ruta del volume para Parquets intermedios" }
  oracle_host:         { description: "Host Oracle" }
  oracle_port:         { description: "Puerto Oracle" }
  oracle_service:      { description: "Service name Oracle" }
  oracle_user:         { description: "Usuario Oracle (NO esta en el secret scope, va explicito)" }
  oracle_secret_scope: { description: "Databricks Secret Scope que contiene la contraseña Oracle (varía por ambiente)" }
  oracle_password_key: { description: "Key del password Oracle dentro del secret scope" }
  pause_schedule:      { description: "PAUSED en dllo, UNPAUSED en uat/pdn" }
  service_principal:   { description: "Service principal usado en run_as (dllo)" }
  cluster_id:          { description: "ID del cluster compartido (solo aplica para dllo)", default: "" }
  spark_version:       { description: "Databricks Runtime (aplica para uat/pdn)", default: "" }
  node_type_id:        { description: "Tipo de nodo (aplica para uat/pdn)", default: "" }
  num_workers:         { description: "Cantidad de workers (aplica para uat/pdn)", default: "0" }


# Despliegue en ruta COMPARTIDA. 

targets:
  
  # DESARROLLO
  # Usa existing_cluster_id: el SP de dllo no tiene
  # permisos para crear clusters nuevos en plataforma.
  # oracledb ya esta instalado en el cluster compartido, y el
  # paquete del framework se resuelve via sys.path (fallback del
  # notebook 20_ejecutar_framework.py), por eso NO hay 'libraries:'.
  
  dllo:
    mode: production
    default: true
    workspace:
      host: https://adb-1161217326944529.9.azuredatabricks.net
      root_path: /Workspace/Users/${var.service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal}
      #user_name: mpalomin@contratista.epm.co
    variables:
      catalog_destino: epm_datalabs_catalog_dllo
      schema_destino: facturacion
      volume_path: /Volumes/epm_datalake_vol_np/facturacion_vol/facturacion_bronze_vol/vera_framework/dllo
      oracle_host: epm-to34.corp.epm.com.co
      oracle_port: '1521'
      oracle_service: SFUAT
      oracle_user: SQL_EPMBOTPD05
      oracle_secret_scope: AZ-SecretScopeDBKS-EPM-NP-KV-DLLO
      oracle_password_key: AZ-SECRET-EPM-BOTPD05-FACTURACION-CTATECNICA
      pause_schedule: PAUSED
      service_principal: 2080d313-3074-4adf-8265-916ef7645dc2
      cluster_id: 0722-211855-e1a090ph
    resources:
      jobs:
        vera_framework_daily:
          name: vera_framework_daily_${bundle.target}
          permissions:
            - level: CAN_MANAGE_RUN
              user_name: frans.taboada@epm.com.co
            - level: CAN_MANAGE_RUN
              user_name: mpalomin@contratista.epm.co
          schedule:
            quartz_cron_expression: "0 0 4 * * ?"   # 04:00 hora Colombia
            timezone_id: America/Bogota
            pause_status: ${var.pause_schedule}
          email_notifications:
            on_failure:
              - miguel.palomino@dataknow.co
              - mpalomin@contratista.epm.co
          tasks:
            - task_key: ejecutar_framework
              existing_cluster_id: ${var.cluster_id}
              notebook_task:
                notebook_path: ./notebooks/20_ejecutar_framework.py
                base_parameters:
                  ambiente: ${bundle.target}
                  catalog_destino: ${var.catalog_destino}
                  schema_destino: ${var.schema_destino}
                  job_name: vera_framework
                  volume_path: ${var.volume_path}
                  oracle_secret_scope: ${var.oracle_secret_scope}
                  oracle_user: ${var.oracle_user}
                  oracle_password_key: ${var.oracle_password_key}
                  oracle_host: ${var.oracle_host}
                  oracle_port: ${var.oracle_port}
                  oracle_service: ${var.oracle_service}

  
  # UAT
  # Usa new_cluster (cluster efímero por job).
  
  uat:
    mode: production
    workspace:
      host: https://adb-6159907084216583.3.azuredatabricks.net
      root_path: /Workspace/Users/${var.service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal}
    variables:
