      schema_destino: facturacion
      volume_path: /Volumes/epm_datalake_vol_np/facturacion_vol/facturacion_bronze_vol/vera_framework/uat
      oracle_host: epm-to34.corp.epm.com.co
      oracle_port: '1521'
      oracle_service: SFUAT
      oracle_user: SQL_EPMBOTPD05 
      oracle_secret_scope: AZ-SecretScopeDBKS-EPM-NP-KV-DLLO
      oracle_password_key: AZ-SECRET-EPM-BOTPD05-FACTURACION-CTATECNICA
      service_principal: c0b3fdca-baec-4bab-9f08-c6e222d921ae
      pause_schedule: UNPAUSED
      spark_version: 15.4.x-scala2.12
      node_type_id: Standard_DS3_v2
      num_workers: 2
    resources:
      jobs:
        vera_framework_daily:
          name: vera_framework_daily_${bundle.target}
          permissions:
            - level: CAN_MANAGE_RUN
              user_name: frans.taboada@epm.com.co
            - level: CAN_MANAGE_RUN
              user_name: mpalomin@contratista.epm.co
          schedule:
            quartz_cron_expression: "0 0 4 * * ?"   # 04:00 hora Colombia
            timezone_id: America/Bogota
            pause_status: ${var.pause_schedule}
          email_notifications:
            on_failure:
